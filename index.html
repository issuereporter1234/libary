<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>issuereporter1234's libary</h1>
<button id="new-book">New book</button>
    <table border="1">
    <thead>
        <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Number of pages</th>
                <th>Have i read the book?</th>
                <th></th>
        </tr>
    </thead>

    <tbody></tbody>
</table>
<div id="add-book-form">
    <div class="container1">
    <div class="exp-1">Add new book</div>
    <img src="img/circle-close-multiple-svgrepo-com.svg" alt="close icon" class="close" id="close">
    </div>
    <form id="book-form">
    
        <label for="Name">Book Name</label>
        <input name="name" id="name" type="text" required>

        <label for="author">Author</label>
        <input name="author" id="author" type="text" required>

        <label for="pages">Number of Pages</label>
        <input name="pages" id="pages" type="number" required>
        <div>
        <label for="haveRead">I have read the book</label>
        <input type="checkbox" name="haveRead" id="haveRead" value="true">
        </div>
        <button id="add">Add new book</button>
    </form>
</div>



    <script src="script.js"></script>
</body>
</html>
